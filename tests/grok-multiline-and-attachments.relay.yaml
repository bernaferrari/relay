schemaVersion: 1
recordingFormatVersion: 2
id: grok-multiline-and-attachments
name: Grok · multiline input and attachments
description: Exercise multiline paste/copy, keyboard dismissal, scrolling, and the exact five-item attachment menu.
variables:
  short_text: Relay copy and paste should preserve this sentence.
  multiline_text: |-
    First line: preserve this text.
    Second line: keep the line break.
    Third line: do not jump the cursor.
steps:
  - kind: module
    recipeId: grok-open-composer
  - kind: clipboard
    action: paste
    text: "{{multiline_text}}"
    target:
      identifier: ask.toolbar.textfield
    note: Paste is a single native transaction so Android and iOS keep multiline text intact.
  - kind: clipboard
    action: copy
    target:
      identifier: ask.toolbar.textfield
    expect: "{{multiline_text}}"
    match: exact
  - kind: clipboard
    action: read
    expect: "{{multiline_text}}"
    match: exact
  - kind: type
    text: "{{short_text}}"
    target:
      identifier: ask.toolbar.textfield
    mode: replace
  - kind: clipboard
    action: copy
    target:
      identifier: ask.toolbar.textfield
    expect: "{{short_text}}"
    match: exact
  - kind: clipboard
    action: paste
    target:
      identifier: ask.toolbar.textfield
    note: Paste the value that the immediately preceding copy placed on the system clipboard.
  - kind: clipboard
    action: copy
    target:
      identifier: ask.toolbar.textfield
    expect: "{{short_text}}"
    match: exact
  - kind: clipboard
    action: paste
    text: "{{multiline_text}}"
    target:
      identifier: ask.toolbar.textfield
    note: Replace the short value with the multiline request through the native paste path.
  - kind: clipboard
    action: copy
    target:
      identifier: ask.toolbar.textfield
    expect: "{{multiline_text}}"
    match: exact
  - kind: device
    action: keyboard-dismiss
  - kind: scroll
    direction: down
    amount: 0.45
  - kind: scroll
    direction: up
    amount: 0.45
  - kind: tap
    target:
      identifier: ask.toolbar.send.button
      label: Send
  - kind: wait-response
    target:
      ref: '@answer'
    idleTarget:
      identifier: response.done
    timeoutMs: 90000
    stableForMs: 1500
  - kind: screenshot
    caption: Multiline response after scroll and paste
  - kind: tap
    target:
      identifier: ask.toolbar.add.button
      label: Add
      text: '+'
    fallbackTargets:
      - label: '+'
      - label: Attach
  - kind: expect-set
    identifierPrefix: ask.toolbar.add.menu.
    labels:
      - Camera
      - Photo or Video
      - Files
      - Skills
      - Connectors
    timeoutMs: 5000
  - kind: screenshot
    caption: Attachment menu contains only Camera, Photo or Video, Files, Skills, and Connectors
  - kind: tap
    target:
      identifier: ask.toolbar.textfield
  - kind: expect
    target:
      identifier: ask.toolbar.add.menu.camera
    condition: gone
    timeoutMs: 5000
    note: Tapping outside the attachment menu must dismiss it without requiring system Back.
