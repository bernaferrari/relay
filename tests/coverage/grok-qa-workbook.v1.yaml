# Reviewed Grok QA coverage manifest (RC-09 freeze + RC-13 evidence packets / user review §3 and §6A).
# Source workbook grok-qa-graph.xlsx is unchanged. This freeze corrects advertised
# "16 live cases" to 15 active families. grok-ios-daily 12/12 is not this workbook.
# Coverage is only an explicit reviewed dest-end binding whose Test executed that
# original's causal action. Similar names never cover. Captions are display text;
# obligations are plannedSlots identities (not "Attach" / "Settings").
# Packets: view=single view, transition=before/after, screenshot-receipt=screenshot+file/link receipt,
# persistence=before/restart/after, sequence=short temporal sequence, generated-output=declared phase.
# suggestedExecutionQueue is Fast UI | live-output | stateful-survival — not a Test binding.
# RC-23 dest-ends bind orig 4 (attach menu view) and orig 40 (settings inventory view) only.
# Composer-focus does not cover S03. Imagine dest-end does not cover orig 37/54.
# RC-24 S02 shell packets stay unbound: explicit test-action evidence-needed
# (before/after + receipt; logo adds sequence). Similar sidebar/logo/imagine/new-chat
# names do not cover. Leftover dest skip is only GQA-004/040 capture-view.
# RC-25 S05 model/preset packets stay unbound: GQA-007 test-action must change
# selection (leftover Fast-checked / inspect-only sheet is not coverage).
# GQA-008 presets stay mobile inventory + open TAP; Customize Grok conflict unresolved.
# RC-26 S08 output-battery packets stay unbound: generated-output capture
# without arithmetic/Markdown/answer judge. Original criteria stay on the slot.
# Leftover 3*5 extract-15 / capital extract-Paris is not coverage.
