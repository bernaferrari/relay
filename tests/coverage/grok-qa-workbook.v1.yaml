# Reviewed Grok QA coverage manifest (RC-09 freeze + RC-13 evidence packets / user review §3 and §6A).
# Source workbook grok-qa-graph.xlsx is unchanged. This freeze corrects advertised
# "16 live cases" to 15 active families. grok-ios-daily 12/12 is not this workbook.
# Coverage is only an explicit reviewed dest-end binding whose Test executed that
# original's causal action. Similar names never cover. Captions are display text;
# obligations are plannedSlots identities (not "Attach" / "Settings").
# Packets: view=single view, transition=before/after, screenshot-receipt=screenshot+file/link receipt,
# persistence=before/restart/after, sequence=short temporal sequence, generated-output=declared phase.
# suggestedExecutionQueue is Fast UI | live-output | stateful-survival — not a Test binding.
# RC-23 dest-ends bind orig 4 (attach menu view) and orig 40 (settings inventory view) only.
# Composer-focus does not cover S03. Imagine dest-end does not cover orig 37/54.
# RC-24 S02 shell packets stay unbound: explicit test-action evidence-needed
# (before/after + receipt; logo adds sequence). Similar sidebar/logo/imagine/new-chat
# names do not cover. Leftover dest skip is only GQA-004/040 capture-view.
# RC-25 S05 model/preset packets stay unbound: GQA-007 test-action must change
# selection (leftover Fast-checked / inspect-only sheet is not coverage).
# GQA-008 presets stay mobile inventory + open TAP; Customize Grok conflict unresolved.
# RC-26 S08 output-battery packets stay unbound: generated-output capture
# without arithmetic/Markdown/answer judge. Original criteria stay on the slot.
# Leftover 3*5 extract-15 / capital extract-Paris is not coverage.
# RC-27 S01 auth packets stay unbound: explicit test-action evidence-needed
# (isolated Sign Out / Continue with X / Sign Up). Cloudflare Sign up and
# weekly Continue-with-X pause are not coverage. Similar sign-out/signup
# names do not cover. Leftover dest skip is only GQA-004/040 capture-view.
# RC-28 S03 composer packets stay unbound: explicit test-action evidence-needed
# (type+send TAP, expanded composer view, typeahead persistence). Composer-focus
# inspect, logged-out send-hello paywall, and 3*5 multiline extract-15 do not
# cover. Similar send/multiline/composer names do not cover. Leftover dest skip
# is only GQA-004/040 capture-view.
# RC-29 S06 Auto-routing packets stay unbound: explicit test-action
# evidence-needed (Auto prompt TAP + Think harder / Quick answer routing).
# Inspect-only model-iterate, Fast/Expert SuperGrok pricing TAP, leftover
# Fast-checked sheet, and Think harder YAML seed do not cover. Similar
# auto/fast/expert/think-harder names do not cover. Leftover dest skip is
# only GQA-004/040 capture-view.
# RC-30 S07 response-chrome packets stay unbound: explicit test-action
# evidence-needed (toolbar TAP, follow-up chip TAP, autoscroll sequence,
# share TAP + copied-link receipt). Leftover 3*5 extract-15 toolbar
# expect-set / dest-end toolbar-existing / More extras-forbid,
# clipboard-denied share toast, and more-header chrome-only do not cover.
# Similar toolbar/share/chip names do not cover. Leftover dest skip is
# only GQA-004/040 capture-view.
# RC-31 S09 single-agent tools + sources packets stay unbound: explicit
# test-action evidence-needed (Expert web-search TAP + sources-rail TAP,
# Slack tool+web TAP + thinking-trace expand, Latest news TAP + sources
# TAP). YAML typeahead/sources/code/news unrecorded, leftover 3*5
# extract-15 (Search the web absent), inspect-only Expert sheet /
# model-iterate, and plugins overlay (do not add Gmail/Drive) do not
# cover. Heavy GQA-031/057 stay S10. Similar sources/news/slack/plugins
# names do not cover. Leftover dest skip is only GQA-004/040 capture-view.
# RC-32 S10 Heavy multi-agent packets stay unbound: explicit test-action
# evidence-needed (Heavy tool+web TAP + Agents-working sequence,
# Heavy Latest news TAP + note-taker/sources TAP, Heavy investment TAP
# + agents chrome). YAML sources/news unrecorded, leftover 3*5
# extract-15 (Search the web absent), inspect-only Expert / Heavy sheet
# / model-iterate, plugins overlay (do not add Gmail/Drive), finance
# dest-end (do not tap Add), orig 50 Heavy 5-image, and S09 single-agent
# Slack/news do not cover. Similar heavy/news/slack/finance/plugins
# names do not cover. Leftover dest skip is only GQA-004/040 capture-view.
# RC-33 S11 image gen + edit + export packets stay unbound: explicit
# test-action evidence-needed (generate TAP + download TAP, Make Video
# TAP, Heavy/Expert 5-image edit TAP, Draw a puppy TAP, Draw a hat TAP).
# Imagine dest-end / iOS Imagine Unbound / logged-out Imagine judged
# (do not require generated images) / UNRECORDED orig 50 Heavy 5-image
# / leftover 3*5 extract-15 / S02 Imagine from menu / S10 Heavy agents
# / GQA-008 Create Videos preset do not cover. Similar imagine/puppy/
# download/video/hat names do not cover. Leftover dest skip is only
# GQA-004/040 capture-view.
# RC-34 S12 image-search packets stay unbound: explicit test-action
# evidence-needed (find-3-images TAP, similar TAP, similar-to-object
# TAP). Imagine dest-end / iOS Imagine Unbound / logged-out Imagine
# judged / leftover 3*5 extract-15 / S11 image gen / S02 Imagine from
# menu / S10 Heavy / GQA-008 Create Videos / history Command Menu
# search do not cover. Similar imagine/search/puppy names do not
# cover. Leftover dest skip is only GQA-004/040 capture-view.
# RC-35 S13 history-lifecycle packets stay unbound: explicit
# test-action evidence-needed (open older conversation TAP + send,
# History/Conversations expand TAP, search keyword TAP + clear,
# delete TAP + restart). Dest-end open-conversation (no new prompt) /
# older-chat compile-blocked / Command Menu search /
# Android Search dest-end / history-collapse Hide Conversation
# Previews / leftover 3*5 extract-15 / S12 Image search / draft
# delete-wrong-chat do not cover. Similar history/search/delete/
# older-chat names do not cover. Leftover dest skip is only
# GQA-004/040 capture-view.
# RC-36 S14 App Language + SuperGrok row packets stay unbound:
# explicit test-action evidence-needed (App Language TAP + persist,
# SuperGrok row TAP + view). GQA-040 stays the RC-23 dest-end
# settings inventory view. Settings dest-end / inspect-only
# Language Selector (do not tap a language) / SuperGrok home
# banner / hide-upsell inspect (do not tap Hide or Upgrade) /
# logged-out Light/Dark/System / iOS App Language OS handoff
# do not cover. Do not tap App Language in default capture. Do
# not tap Upgrade / Try now / Dismiss / Sign Out. Similar
# settings/language/banner/upsell names do not cover. Leftover
# dest skip is only GQA-004/040 capture-view.
