packages:
  - "packages/*"

allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: true
  "@tailwindcss/oxide": true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  solid-js: ^1.9.14
  typescript: ^7.0.2

minimumReleaseAgeExclude:
  - "@types/react-dom@19.2.7"

overrides:
  vite: "catalog:"
  "@xhmikosr/decompress": "^10.2.1"
  "file-type": "21.3.2"
  # electron-builder 26.15.3 still resolves these vulnerable transitives. Keep
  # the compatible patched floors explicit until its dependency graph catches up.
  "brace-expansion@^1.1.0": "1.1.18"
  "brace-expansion@^2.1.0": "2.1.4"
  "brace-expansion@^5.0.0": "5.0.9"
  "fast-uri@^3.0.0": "3.1.5"
  "js-yaml@^4.0.0": "4.3.1"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# @relay/mcp peers the private workspace package @relay/runtime. pnpm update
# --latest would otherwise ask the registry for it and fail with a 404.
updateConfig:
  ignoreDependencies:
    - "@relay/runtime"
