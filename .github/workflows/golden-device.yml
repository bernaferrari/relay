name: Golden device acceptance (quarantined hardware)

on:
  workflow_dispatch:
  schedule:
    # The runner is deliberately outside ordinary PR CI. This is a real-hardware
    # acceptance lane, not an optional cloud-runner smoke probe.
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  # Never cancel input or recovery while a physical fixture is mid-run.
  group: golden-device-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Android + iOS fixture acceptance
    # This label belongs only on the quarantined Mac that has the two configured
    # fixtures, Xcode/Developer Disk Image support, adb, and go-ios provisioned.
    runs-on: [self-hosted, macOS, relay-golden-device]
    environment: golden-device-quarantine
    timeout-minutes: 45
    env:
      RELAY_PORT: "18787"
      RELAY_URL: http://127.0.0.1:18787
      RELAY_ACTOR_ID: system:golden-device
      # Recipe IDs in the protected fixture contract resolve only from this
      # checked-out, reviewed source — never a stale runner-local catalog.
      RELAY_TESTS_DIR: ${{ github.workspace }}/tests
      GOLDEN_ACCEPTANCE_MODE: required
      # Configure this protected Environment secret with the schema documented
      # in docs/GOLDEN_DEVICE_ACCEPTANCE.md. An empty value is a hard failure.
      GOLDEN_FIXTURE_CONFIG: ${{ secrets.RELAY_GOLDEN_FIXTURE_CONFIG }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner context is available to steps, not job-level env. Export
      # target-local paths before any command needs them so GitHub can parse
      # the workflow and every later step receives the same isolated roots.
      - name: Configure isolated acceptance paths
        run: |
          {
            echo "RELAY_STATE_DIR=$RUNNER_TEMP/relay-golden-state"
            echo "GOLDEN_ARTIFACT_DIR=$RUNNER_TEMP/relay-golden-artifacts"
            echo "RELAY_RUNS_DIR=$RUNNER_TEMP/relay-golden-artifacts/runs"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.10.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: packages/ios-preview-producer/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the bounded iOS pixel producer
        run: pnpm ios-preview:build

      - name: Prepare isolated acceptance evidence roots
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$GOLDEN_ARTIFACT_DIR" "$RELAY_STATE_DIR" "$RELAY_RUNS_DIR"
          xcodebuild -version | tee "$GOLDEN_ARTIFACT_DIR/xcode-version.txt"
          adb version | tee "$GOLDEN_ARTIFACT_DIR/adb-version.txt"

      - name: Start isolated Relay server
        run: |
          set -euo pipefail
          node node_modules/tsx/dist/cli.mjs packages/server/src/index.ts --port "$RELAY_PORT" > "$GOLDEN_ARTIFACT_DIR/server.log" 2>&1 &
          echo $! > "$GOLDEN_ARTIFACT_DIR/server.pid"

      - name: Wait for Relay health
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS "$RELAY_URL/health" > "$GOLDEN_ARTIFACT_DIR/health.json"; then
              exit 0
            fi
            sleep 1
          done
          tail -n 200 "$GOLDEN_ARTIFACT_DIR/server.log" >&2 || true
          exit 1

      - name: Execute strict Android+iOS acceptance
        run: pnpm test:golden:acceptance

      - name: Stop isolated Relay server
        if: always()
        run: |
          if [ -f "$GOLDEN_ARTIFACT_DIR/server.pid" ]; then
            kill "$(cat "$GOLDEN_ARTIFACT_DIR/server.pid")" 2>/dev/null || true
          fi

      - name: Upload complete hardware evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-golden-device-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relay-golden-artifacts
          if-no-files-found: error
          retention-days: 30
