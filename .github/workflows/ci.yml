name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.10.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: packages/ios-preview-producer/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Verify packaged iOS preview sidecar provenance
        run: |
          for arch in arm64 x64; do
            RELAY_IOS_PREVIEW_SIDECAR_ARCH="$arch" pnpm ios-preview:package
            RELAY_IOS_PREVIEW_SIDECAR_ARCH="$arch" pnpm ios-preview:verify
          done

      - name: Golden device path (skips without hardware)
        continue-on-error: true
        env:
          GOLDEN_REQUIRE_DEVICE: "0"
          RELAY_URL: http://127.0.0.1:8787
        run: pnpm test:golden
