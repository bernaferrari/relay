name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: packages/ios-preview-producer/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      - name: Verify packaged iOS preview sidecar provenance
        run: |
          for arch in arm64 x64; do
            RELAY_IOS_PREVIEW_SIDECAR_ARCH="$arch" pnpm ios-preview:package
            RELAY_IOS_PREVIEW_SIDECAR_ARCH="$arch" pnpm ios-preview:verify
          done

      - name: Golden device path (skips without hardware)
        continue-on-error: true
        env:
          GOLDEN_REQUIRE_DEVICE: "0"
          RELAY_URL: http://127.0.0.1:8787
        run: pnpm test:golden
