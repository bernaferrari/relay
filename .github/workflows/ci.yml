name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Fail closed at the job boundary. GitHub-hosted ubuntu-latest can refuse
    # assignment when account payments fail or the spending limit blocks
    # minutes. Those runs complete with runner_id 0 and steps [] — that is not
    # a repository check result and must not be treated as typecheck/test
    # output. Local repository verification is `.github/workflows/local-ci.yml`.
    name: repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Fixture provenance tests verify the repaired source is the direct
          # descendant of the deliberately seeded regression commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.10.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: packages/ios-preview-producer/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      # Keep these stages aligned with `pnpm verify`, but expose each trust
      # boundary separately. A setup/install failure therefore cannot look
      # like a repository typecheck or test failure in the Check UI.
      - name: Format, lint, and static checks
        # Vite+ is a workspace dependency; package-manager installs do not
        # expose project bins as global commands on clean hosted runners.
        run: pnpm run check

      - name: Validate GitHub workflows
        run: pnpm run check:workflows

      - name: Validate documentation
        run: pnpm run check:docs

      - name: Validate architecture boundaries
        run: pnpm run check:architecture

      - name: Run architecture contract tests
        run: pnpm run test:architecture

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Test iOS preview producer
        run: pnpm run ios-preview:test

      - name: Test packages
        run: pnpm run test:packages

      - name: Test Vite+ workspace
        run: pnpm exec vp test

      - name: Build React Product app
        run: pnpm --filter @relay/app build

      - name: Build desktop
        run: pnpm --filter @relay/desktop build

      - name: Check Product visual baselines and accessibility
        run: pnpm run test:visual

      - name: Preserve failed Product visual captures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-visual-failure
          path: .relay/visual-regression/*.png
          if-no-files-found: ignore

      - name: Run Product browser acceptance
        run: pnpm run test:browser

      - name: Run Product desktop acceptance
        run: xvfb-run --auto-servernum pnpm run test:electron

      - name: Verify installed iOS preview sidecar
        run: pnpm run ios-preview:verify

      - name: Verify packaged iOS preview sidecar provenance
        run: |
          for arch in arm64 x64; do
            RELAY_IOS_PREVIEW_SIDECAR_ARCH="$arch" pnpm ios-preview:package
            RELAY_IOS_PREVIEW_SIDECAR_ARCH="$arch" pnpm ios-preview:verify
          done

      - name: Golden device path (skips without hardware)
        continue-on-error: true
        env:
          GOLDEN_REQUIRE_DEVICE: "0"
          RELAY_URL: http://127.0.0.1:8787
        run: pnpm test:golden
